services:
  rezio-api:
    build:
      context: .
      dockerfile: services/monolith/Dockerfile
    ports:
      - "8080:8080"
    environment:
      LOKI_URL: http://loki:3100
      DATABASE_URL: Host=postgres;Database=rezio;Username=rezio;Password=rezio
    depends_on:
      loki:
        condition: service_started
      postgres:
        condition: service_healthy

  scraper-api:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    ports:
      - "8082:8080"
    environment:
      LOKI_URL: http://loki:3100
      MONOLITH_URL: http://rezio-api:8080
    depends_on:
      loki:
        condition: service_started
      rezio-api:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rezio
      POSTGRES_PASSWORD: rezio
      POSTGRES_DB: rezio
    ports:
      - "5432:5432"
    volumes:
      - rezio-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezio"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  healthchecks-ui:
    image: xabarilcoding/healthchecksui:5.0.0
    ports:
      - "8090:80"
    environment:
      HealthChecksUI__HealthChecks__0__Name: rezio-api
      HealthChecksUI__HealthChecks__0__Uri: http://rezio-api:8080/health
      HealthChecksUI__HealthChecks__1__Name: scraper-api
      HealthChecksUI__HealthChecks__1__Uri: http://scraper-api:8080/health
    depends_on:
      - rezio-api
      - scraper-api

volumes:
  rezio-pg:
