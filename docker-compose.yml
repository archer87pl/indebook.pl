services:
  pricing-api:
    build:
      context: .
      dockerfile: services/pricing/Dockerfile
    ports:
      - "8080:8080"
    environment:
      LOKI_URL: http://loki:3100
    depends_on:
      - loki

  demand-api:
    build:
      context: .
      dockerfile: services/demand/Dockerfile
    ports:
      - "8081:8080"
    environment:
      LOKI_URL: http://loki:3100
    depends_on:
      - loki

  scraper-api:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    ports:
      - "8082:8080"
    environment:
      LOKI_URL: http://loki:3100
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.1.0
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  healthchecks-ui:
    image: xabarilcoding/healthchecksui:5.0.0
    ports:
      - "8090:80"
    environment:
      HealthChecksUI__HealthChecks__0__Name: pricing-api
      HealthChecksUI__HealthChecks__0__Uri: http://pricing-api:8080/health
      HealthChecksUI__HealthChecks__1__Name: demand-api
      HealthChecksUI__HealthChecks__1__Uri: http://demand-api:8080/health
      HealthChecksUI__HealthChecks__2__Name: scraper-api
      HealthChecksUI__HealthChecks__2__Uri: http://scraper-api:8080/health
    depends_on:
      - pricing-api
      - demand-api
      - scraper-api
