# Cały system: RezFlow (aplikacja + Postgres) razem z silnikiem cen SmartRate
# z sąsiedniego repo Rezio.SmartRate. Obie definicje trafiają do JEDNEGO
# projektu Compose, więc dzielą sieć i widzą się po nazwach usług — dlatego
# SMARTRATE_URL=http://rezio-api:8080 działa bez wystawiania portów na zewnątrz.
#
#   docker compose -f docker-compose.full.yml up -d --build
#
# SmartRate mieszka w tym samym repo (services/smartrate), więc ścieżka jest
# stała — wcześniej wskazywała na sąsiedni katalog i działała tylko wtedy, gdy
# ktoś sklonował oba repozytoria obok siebie pod właściwymi nazwami.
#
# Bazy nie kolidują: RezFlow ma „rezflow-db", SmartRate „postgres". Porty
# SmartRate przemapowane, bo domyślne zderzają się z aplikacją (Grafana 3000)
# i z testami e2e (Loki 3100 = Playwright).
include:
  - path: docker-compose.yml
  - path: services/smartrate/docker-compose.yml

services:
  rezflow:
    environment:
      # prawdziwy silnik zamiast stuba — nazwa usługi z include'owanego compose
      SMARTRATE_URL: "http://rezio-api:8080"
      SMARTRATE_API_KEY: "${SMARTRATE_API_KEY:-}"
      SMARTRATE_STUB: ""
    depends_on:
      rezflow-db:
        condition: service_healthy
      rezio-api:
        condition: service_started

  rezio-api:
    # ten sam sekret po obu stronach. Pusty = endpointy SmartRate otwarte —
    # dopuszczalne tylko dlatego, że nie wystawiamy ich poza sieć Compose.
    environment:
      SMARTRATE_API_KEY: "${SMARTRATE_API_KEY:-}"

  grafana:
    ports: !override ["3001:3000"]

  loki:
    ports: !override ["3101:3100"]
