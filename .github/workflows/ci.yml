name: ci
# Aplikacja RezFlow (korzeń repo). Zmiany wyłącznie w silniku cen nie odpalają
# tego workflow — ma swój własny (smartrate.yml). Katalog contracts/ celowo
# NIE jest wykluczony: to granica HTTP między systemami, więc jego zmiana musi
# przejść przez testy obu stron.
on:
  push:
    branches: [main]
    paths-ignore:
      - "services/smartrate/**"
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "services/smartrate/**"
      - "docs/**"
      - "**.md"
  # e2e uruchamiamy WYŁĄCZNIE ręcznie (Actions → ci → Run workflow):
  # przy każdym pushu zjadałyby minuty runnera nieproporcjonalnie do tego,
  # co dokładają — logikę pokrywają testy jednostkowe.
  workflow_dispatch:

jobs:
  # Szybka bramka: typy, lint, testy jednostkowe i build. Bez bazy — testy
  # jednostkowe jej nie potrzebują (te, które potrzebują, same się pomijają
  # bez TEST_DATABASE_URL).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ta sama wersja npm co w lockfile i w Dockerfile — starszy npm inaczej
      # rozwiazuje peery optional deps i `npm ci` sie wywala
      - run: npm i -g npm@11.11.0
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  # Testy e2e chodza po realnej aplikacji, wiec potrzebuja Postgresa
  # i danych startowych — a przez to sa najdrozszym jobem w tym repo.
  # Dlatego NIE odpalaja sie na pushu ani na PR: tylko na zadanie
  # (Actions -> ci -> Run workflow). Lokalnie: `npm run test:e2e`.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rezflow
          POSTGRES_PASSWORD: rezflow
          POSTGRES_DB: rezflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rezflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://rezflow:rezflow@localhost:5432/rezflow
      DIRECT_URL: postgresql://rezflow:rezflow@localhost:5432/rezflow
      APP_URL: http://localhost:3100
      APP_HOSTS: localhost
      SITES_BASE_DOMAIN: localhost
      # deterministyczny silnik cen — bez wychodzenia do sieci
      SMARTRATE_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11.11.0
      - run: npm ci --no-audit --no-fund
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
